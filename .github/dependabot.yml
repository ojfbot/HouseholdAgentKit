# Dependency updates as pull requests. Nothing here merges by itself: each PR runs the required checks and
# waits for the owner (AGENTS.md). Grouped and capped so a week of updates is one or two PRs, not twenty.
# A ruff update can move the lint ratchet's counts; the PR then fails `kit lint`, and whoever takes it
# fixes the new findings or lowers the floor with `kit lint --update-baseline`. A floor is never raised.
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 2
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
