# Required check `privacy-guard`. Deny by default: `kit privacy scan` runs every rule on every file in the
# checkout, binaries included, whatever directory it is in. The only way out is an entry in
# kit/privacy-allow.yaml with its reason; an entry that suppresses nothing fails the scan. The rules live in
# kit/src/kit_cli/privacy.py, so this job, `kit check` and the pre-commit hook run the same code.
name: privacy-guard
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  privacy-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - run: uv sync --frozen
      - name: every rule on every file; exceptions only from kit/privacy-allow.yaml
        run: uv run kit privacy scan
