# Pre-commit hooks. Local hooks only: every tool comes from uv.lock through `uv run`, so the hook, `kit check`
# and CI run the same versions, and nothing is downloaded or compiled at commit time.
# Doctor's `hooks_runnable` check goes red if a hook names a command, a kit subcommand or a path that does not exist.
#
# Installing them is the fleet-conventions rung's call (rung 3: the fleet may set its own hooks path).
# Until then, run the same thing by hand: `uv run kit check --fast`.
repos:
  - repo: local
    hooks:
      - id: kit-check-fast
        name: kit check --fast (lint and format policy, types, privacy guard; the same steps as CI)
        entry: uv run kit check --fast
        language: system
        pass_filenames: false
      - id: privacy-staged
        name: kit privacy scan --staged (every rule on exactly what this commit contains)
        entry: uv run kit privacy scan --staged
        language: system
        pass_filenames: false
