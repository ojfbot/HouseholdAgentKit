[project]
name = "kit-cli"
version = "0.1.0"
description = "The kit command line: doctor, hello-world, eval, gate. Synthetic only."
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
dependencies = ["kit-contracts", "kit-verifier", "kit-eval-harness", "kit-gate", "kit-mock-gateway", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kit_cli*"]

[project.scripts]
kit = "kit_cli.__main__:main"

[tool.uv.sources]
kit-contracts = {workspace = true}
kit-verifier = {workspace = true}
kit-mock-gateway = {workspace = true}
kit-eval-harness = {workspace = true}
kit-gate = {workspace = true}
