[project]
name = "kit-card-writer"
version = "0.1.0"
description = "K11 role-scoped card writer with a number guard. Synthetic only."
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
dependencies = []

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["card_writer*"]
