[project]
name = "kit-contracts"
version = "0.1.0"
description = "Draft contract mirror (Fork F owns the content). Synthetic only."
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
dependencies = []

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kit_contracts*"]

[tool.uv.sources]
kit-contracts = {workspace = true}
kit-verifier = {workspace = true}
kit-mock-gateway = {workspace = true}
kit-eval-harness = {workspace = true}
