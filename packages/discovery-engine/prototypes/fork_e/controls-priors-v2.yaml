proposal: controls@2 priors (Fork E -> Fork C)
as_of: '2026-11-19'
rules:
- 'Priors only: Fork C owns controls@2 and may override.'
- stated = Walmart said it wants this (registry rows cited); would_also_serve = our inference; keep them in separate keys so the UI can show which
  is which.
- Never-tunable keys from controls@1 stay never-tunable; CON-05 and CON-21 are Walmart-published, so price and hiding cheaper options are out
  of every profile.
- 'Fairness floor unchanged: protected-tag families never weighted below 1.0.'
- value_prior is a starting point for the value vector; bounds and owner_boost unchanged from controls@1.
