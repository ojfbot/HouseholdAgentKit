org: walmart
org_model_version: org@2
as_of: '2026-11-19'
method:
  evidence: 'hand-curated: which registry rows (fork-e/statements.yaml) state each priority'
  weight: derived = sum over evidence rows of seniority x source_factor x recency, normalized to 1.0 within Walmart priorities and separately
    within partner priorities; never typed by hand
  seniority: CEO 1.0; CFO/EVP 0.8; corporate primary doc 0.9; SVP/VP or named staff 0.6; partner org 0.7; job posting or engineering blog 0.5;
    press/analyst 0.4
  source_factor: walmart_primary or partner 1.0; press quoting a named person 0.8; other press 0.5; analyst 0.5; forum 0.2
  recency: <=6 months 1.0; <=12 0.8; <=24 0.6; older 0.4 (as of 2026-11-19)
  caveat: a weight measures how loudly and how senior, not how important; a quiet priority can still be decisive
