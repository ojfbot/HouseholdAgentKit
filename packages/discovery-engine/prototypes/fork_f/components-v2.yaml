# components@2 — the component catalog for the agent-mediated Walmart shopping stack.
# Owner: Fork F. Supersedes components@1 (fork-c/components-v1.yaml). Proposed 2026-11-19; contract freeze 2026-11-22.
# Every number is synthetic. Every Walmart-side behaviour runs against the twin (K17) until access arrives.
#
# How to read a component:
#   layer       product (problem families decompose into these) | platform (shared runtime) | eval (proves the others)
#   slot        where it sits in the harness: node (LangGraph node) | tool | guard | solver | adapter | store | bus | eval | fixture
#   in/out      typed schemas from `types` below; `reads`/`writes` are versioned shared contracts
#   timing      sync | async | event:<topic>
#   model       default tier, allowed tiers, the seam (one interface), and the deterministic fallback
#   caps        org-model rows it depends on (fork-c/org-model/walmart/capabilities.yaml); unconfirmed ones go through an adapter (adapters below)
#   oracle      the test that defines "good" (unit/property for deterministic; labeled eval set for model lanes)
#   mock        what it is tested against, so it can be built in parallel
#   deps        runtime dependencies (component IDs). Build-time it only needs the contract + mock of each dep.
#   owner/impl/review  FDE role (the planning project) and builder lane; the reviewer is always the other agent
#   effort      S = 1 lane-day, M = 2, L = 3
#   mvp         HW (hello world live) | CARE (Care Profiles) | ENG (engine run) | stub (thin fallback only) | cut (after Dec 2)
#   needs       the needs@1 key that maps a problem card onto this component (decomposition stage)

version: components@2
supersedes: components@1
as_of: 2026-11-19
effort_days: {S: 1, M: 2, L: 3}

roles:
  EL: Engagement lead (the owner)
  HP: Harness & platform engineer
  MF: Models & fine-tuning engineer
  ED: Evals & data engineer
  PD: Product & delivery engineer
  EN: Engine engineer (added 2026-11-19, the owner approved the eight-role roster)
  DX: Demo & experience engineer (added 2026-11-19)
  IQ: Integration & quality lead (added 2026-11-19)

# ---------------------------------------------------------------------------------------------
# Shared result envelope (proposed contract Result@0). Every component returns one of these.
# ---------------------------------------------------------------------------------------------
result:
  ok: {value: T, trace: TraceRef, fallback_used: bool, adapter_id: "str?"}
  refusal: {code: RefusalCode, reason: str, retryable: bool, owner_action: "str?", evidence: [Ref]}
  error: {code: str, retryable: bool}
refusal_codes:
  LOCK_VIOLATION: a cart, swap or edit would break a lock or hard rule (never negotiable)
  OVER_CAP: total exceeds a per-order or per-month cap; route to approver
  OUT_OF_MANDATE: an unattended action falls outside the standing mandate
  RIGHTS_DENIED: the actor's role has no right to this action
  PROFILE_SCOPE: data or address crosses a profile boundary
  ADDRESS_MISMATCH: ship-to differs from the pinned address
  INFEASIBLE: no cart meets the hard constraints; carries the numbers
  UNVERIFIED_CLAIM: a number on a card or brief could not be verified
  CAPABILITY_UNAVAILABLE: the Walmart capability is absent or not exposed; adapter fell back
  STALE: price, stock or slot changed since the cart was built
  AMBIGUOUS: the request is missing a slot; carries at most one clarifying question

# ---------------------------------------------------------------------------------------------
# Types (proposed contract versions in brackets). Field lists, not full JSON Schema; the schema
# files land in packages/contracts/ at freeze.
# ---------------------------------------------------------------------------------------------
types:
  Request: {text: str, actor: MemberRef, channel: "chat|voice|trigger", locale: str, received_at: datetime}
  MemberRef: {member_hash: str, role: "owner|partner|teen|kid|guest|requester|approver_payer|key_holder|treasurer|fulfiller"}
  Mandate:   # [Mandate@1]  v0 + B's requested_by/profile_id + standing block + slack
    mandate_id: str
    principal: MemberRef
    requested_by: MemberRef
    profile_id: "str?"
    occasion: "str?"
    headcount: {adults: int, kids: [int]}
    deadline: {type: "pickup_ready_by|deliver_by|deliver_window", time: datetime, store: "str?", window_end: "datetime?", slack: "duration?"}
    budget: {max: money, includes: ["tax","fees"], hard: bool}
    constraints: [{id: str, kind: "lock|exclude|require|cap|category_block|ship_to", value: any, hardness: "hard|soft", slack: "any?"}]
    locks: [{item_ref: str, level: 0..4, exact_upc: bool}]
    exclude: [str]
    on_hand: [str]
    weights: {savings: float, fresh: float, repeat: float, variety: float}
    standing: {schedule: str, cap_per_order: money, cap_per_month: money, autonomy: "approve_each|within_cap", expires: date, optional: true}
  Brief:     # [Brief@1]  = Sparky brief schema v0 + mandate_id + profile_id; rules travel, reasons don't
    {mandate_id, occasion, headcount, deadline, budget, locks, exclude, on_hand, ask: {options: int, vectors: [str], format: str}, disclosure: {mark_sponsored: bool}, profile_id: "str (optional)"}
  NeedList:  {mandate_id, roles: [{role: str, qty: float, unit: str, required: bool, lockable: bool}], source: "template|rag|explicit|checklist"}
  Offer:     {sku, title, price, unit, stock: "in|low|out|unknown", attrs: AttributeSet, sponsored: bool, source: "discover|sparky"}
  Cart:      {cart_id, mandate_id, lines: [{sku, qty, price, role, lock_ok: bool, sponsored: bool}], subtotal, tax_est, total, slot: SlotPlan, label: str, lines_hash: str}
  VerifyReport: {subject_ref, checks: [{constraint_id, status: "pass|fail|unknown", observed: any, evidence: Ref}], all_hard_pass: bool, unverified_numbers: int}
  SlotPlan:  {store, ready_by: datetime, slot_id: "str?", status: "confirmed|estimated|infeasible", source: "slots_api|heuristic", cutoff: datetime}
  AuthzDecision: {decision: "allow|deny|ask", reason_code: "RefusalCode?", ask_member: "MemberRef?"}
  Poll:      # [Poll@0] unchanged: poll.opened / poll.response / decision, FIFO by poll_id
    {poll_id, mandate_id, carts: [CartSummary], closes_at, policy, rights}
  Card:      # [Card@0] new
    {card_id, audience: MemberRef, kind: "ballot|approval|over_cap|digest|fulfiller|support", sections: [{title, lines: [{text, claim_ref: "str?"}]}], claims: [{id, value, verified_by: Ref}], locale, a11y: {contrast: "AA", reading_level: int}}
  LedgerEntry: # [Ledger@0] new: the audit chain is the ledger, append-only, hash-chained
    {entry_id, episode_id, kind: "mandate|brief|cart|vote|decision|consent|token|order|refund|receipt", refs: [Ref], actor: MemberRef, requested_by: MemberRef, profile_id: "str?", amount: "money?", at: datetime, prev_hash: str, hash: str}
  TriggerEvent: # [Trigger@0] new
    {event_id, source: str, kind: str, occurred_at: datetime, household_hash: str, payload_ref: Ref, dedupe_key: str, confidence: float}
  Notice:    {notice_id, kind: "recall|packaging_change|recipe_change", upc: [str], lots: "[str] (optional)", effective: date, source: str}
  PantryState: {household_hash, items: [{item_ref, qty_est, last_seen: date, source: "receipt|inventory|manual", confidence: float}]}
  AttributeSet: {allergens: [str], contains: [str], packaging_version: "str?", snap_eligible: "bool?", size: "str?", unknown: [str]}
  FulfillerNote: {party: "picker|driver|inhome", order_ref, lines: [{sku, rule: "exact_only|hold_if_oos|sealed|zone"}], text: str, max_len: int}
  Edit:      {kind: "add|remove|swap|constraint|none|out_of_scope", target: "str?", value: "any?", from_member: MemberRef}
  Case:      # [Case@1] v0 + interview mode + B's request types and world events
    {case_id, persona, goal, world_events: [str], adversary: "str?", accept_if: [EndState], mode: "episode|interview", synthetic: true}

# ---------------------------------------------------------------------------------------------
# needs@1 — the controlled vocabulary a problem card carries (new card field `needs[]`).
# Each key maps to exactly one component. The decomposition stage fills it by rule; the judge may add.
# ---------------------------------------------------------------------------------------------
needs:
  parse_intent: K01
  specific_brief: K02
  verify: K03
  solve_cart: K04
  slot_deadline: K05
  household_rules: K06
  scoped_principal: K07
  standing_mandate: K08
  outside_trigger: K09
  group_decision: K10
  role_card: K11
  ledger: K12
  on_hand: K13
  change_notice: K14
  fulfiller_note: K15
  item_attributes: K16
  support_view: K18
  fairness_floor: K19
  conformance: K20
  need_list: K21
  feedback_edits: K22   # strength: enhance (improves a family, never gates its unlock)
  walmart_io: K24

components:
  # ============================ PRODUCT LAYER =============================================
  K01:
    name: Intent parser
    layer: product
    v1: K01
    from: [A lane 1]
    slot: node
    timing: sync
    in: [Request, Household]
    out: Mandate
    reads: [Household@1, Profile@1]
    writes: [Mandate@1]
    errors: [AMBIGUOUS, RIGHTS_DENIED]
    idempotency: pure at temperature 0 for a pinned bundle
    model: {default: small_tuned, tiers: [none, small_tuned, frontier], seam: "ModelPort.structured(schema=Mandate@1)", fallback: "grammar slot-filler (deadline, headcount, budget, locks via rules + date parser); missing hard slot -> one clarifying question"}
    caps: []
    oracle: "slot F1 >= 0.95 on deadline, headcount, budget, locks (labeled set from K25, held-out personas); property: no lock in Household is ever dropped from the Mandate"
    mock: MandateFixture (gold mandates from the case engine)
    owner: MF   # eight-role roster, approved by the owner 2026-11-19
    impl: claude_code
    effort: S
    mvp: HW
    deps: []
    needs: parse_intent
  K02:
    name: Sparky brief writer (lane 13)
    layer: product
    v1: K02
    from: [A lane 13, CAP-27 ask]
    slot: node
    timing: sync
    in: [Mandate]
    out: Brief
    reads: [Mandate@1, Brief@1, org@]
    writes: [Brief@1]
    errors: [UNVERIFIED_CLAIM, CAPABILITY_UNAVAILABLE]
    idempotency: pure; follow-ups keyed (mandate_id, round), max 2 rounds
    model: {default: none, tiers: [none, small_tuned, frontier], seam: "BriefRenderer.render(brief, mode=H1|H2)", fallback: "deterministic projection Mandate -> Brief (H2/H3); template text rendering for H1. The model only phrases H1 text and targeted follow-ups"}
    caps: [CAP-07, CAP-27]
    oracle: "100% of hard constraints present on the wire (H1 text or H2 JSON); disclosure = minimum set (no reasons, no member identities); <= 2 follow-ups; specificity uplift vs generic request on the fixed set"
    mock: mock Sparky in K17 (incentive-driven LLM, plus a scripted replay mode)
    owner: MF   # eight-role roster, approved by the owner 2026-11-19
    impl: claude_code
    effort: S
    mvp: HW
    deps: [K01, K24]
    needs: specific_brief
  K03:
    name: Constraint verifier
    layer: product
    v1: K03
    from: [A lane 13 'check every constraint', A lane 7 (locks/budget half)]
    slot: guard
    timing: sync
    in: [Cart|Brief|Card, Mandate]
    out: VerifyReport
    reads: [Mandate@1, Card@0]
    writes: []
    errors: [UNVERIFIED_CLAIM, LOCK_VIOLATION, OVER_CAP]
    idempotency: pure
    model: {default: none, tiers: [none], fallback: n/a}
    caps: [CAP-04]
    oracle: "property tests: every hard constraint checked; 0 unverified numbers on any card; mutation suite (seeded wrong prices, swapped locked items, over-cap) caught 100%"
    mock: Offer/Cart fixtures with seeded violations
    owner: IQ   # eight-role roster, approved by the owner 2026-11-19
    impl: codex
    effort: S
    mvp: HW
    deps: []
    needs: verify
  K04:
    name: Cart solver (menu builder)
    layer: product
    v1: K04
    from: [A lane 3, platform solver]
    slot: solver
    timing: sync (p95 < 2 s on 500 offers)
    in: [NeedList, Mandate, Offer list]
    out: "Cart x N (distinct trade-off vectors) | INFEASIBLE with numbers"
    reads: [Mandate@1, Catalog@0]
    writes: []
    errors: [INFEASIBLE, LOCK_VIOLATION]
    idempotency: deterministic for (inputs, seed)
    model: {default: none, tiers: [none], fallback: n/a}
    caps: [CAP-04]
    oracle: "feasibility 100% (K03 passes every returned cart); hit@3 vs oracle carts; regret <= bar; diversity rule holds; locks never traded for weight; CON-21 the cheapest qualifying cart is always on the menu or the card says why"
    mock: synthetic catalog slice + oracle carts (K25)
    owner: MF   # eight-role roster, approved by the owner 2026-11-19
    impl: codex
    effort: M
    mvp: HW
    deps: [K03, K24]
    needs: solve_cart
  K05:
    name: Deadline-to-slot feasibility
    layer: product
    v1: K05
    from: [A 'delivery slot valid until the poll closes', A poll deadline timer]
    slot: tool
    timing: sync; re-checked at poll close and at checkout
    in: [Mandate.deadline, store]
    out: SlotPlan
    reads: [Mandate@1, ShoppingPort@1.slots]
    writes: []
    errors: [INFEASIBLE, STALE, CAPABILITY_UNAVAILABLE]
    idempotency: pure for (deadline, store, clock); slot holds, if any, keyed by mandate_id
    model: {default: none, tiers: [none], fallback: "heuristic: store hours + published lead time -> status=estimated; never shown as confirmed"}
    caps: [CAP-10]
    oracle: "0 false promises (no SlotPlan status=confirmed unless the slot API confirmed it); 'by 6' resolved to pickup_ready_by with cutoff; re-solve on STALE at close"
    mock: twin slot calendar with capacity and cutoff jitter
    owner: HP   # eight-role roster, approved by the owner 2026-11-19
    impl: codex
    effort: M
    mvp: HW (estimated mode is enough on the twin)
    deps: [K24]
    needs: slot_deadline
  K06:
    name: Household and org model + rights (PDP)
    layer: product
    v1: K06
    from: [A roles table, A lane 7 (rights half), B served_by, platform household]
    slot: store + guard (authorize)
    timing: sync
    in: [MemberRef, action, resource]
    out: AuthzDecision
    reads: [Household@1]
    writes: [Household@1, "event: rule.changed, address.changed"]
    errors: [RIGHTS_DENIED, LOCK_VIOLATION]
    idempotency: pure reads; writes versioned (household_rev)
    model: {default: none, tiers: [none], fallback: n/a}
    caps: []
    oracle: "property tests over role x action matrix: only the owner changes locks and budget; no member request can put a lock-breaking cart on a ballot; served_by links honoured"
    mock: household fixtures C01-C31 (rules only, never diagnoses)
    owner: PD   # eight-role roster, approved by the owner 2026-11-19
    impl: codex
    effort: M
    mvp: HW
    deps: []
    needs: household_rules
  K07:
    name: Profile scopes (care, multi-address, org principal)
    layer: product
    v1: K07
    from: [B cycle-2 asks 1-4, CAP-21, CAP-28]
    slot: guard + store
    timing: sync
    in: [profile_id, action, Cart|Request]
    out: AuthzDecision
    reads: [Profile@1, Household@1, Mandate@1]
    writes: [Profile@1]
    errors: [PROFILE_SCOPE, ADDRESS_MISMATCH, OVER_CAP]
    idempotency: pure reads
    model: {default: none, tiers: [none], fallback: n/a}
    caps: [CAP-02, CAP-21, CAP-28, CAP-14]
    oracle: "profile_leakage = 0 (usuals, history across profiles); address_integrity = 100% (orders to any non-pinned ship-to refused); blocked_category_reach = 0"
    mock: twin Agent Profile model (announced default + labeled care-profile proposal)
    owner: PD   # eight-role roster, approved by the owner 2026-11-19
    impl: claude_code
    effort: M
    mvp: CARE (care profile only; multi-address and org principal stubbed)
    deps: [K06]
    needs: scoped_principal
  K08:
    name: Standing mandate + guard
    layer: product
    v1: K08
    from: [A M3, B cap per_order/per_month, CAP-24 slack]
    slot: guard
    timing: sync (before every unattended action)
    in: [Mandate.standing, proposed action, spend to date]
    out: AuthzDecision
    reads: [Mandate@1, Ledger@0]
    writes: []
    errors: [OUT_OF_MANDATE, OVER_CAP]
    idempotency: pure given ledger snapshot
    model: {default: none, tiers: [none], fallback: n/a}
    caps: [CAP-02, CAP-24]
    oracle: "0 over-cap orders; 0 unattended actions outside the mandate; over-cap -> ask the approver (never auto-approve on timeout); CON-15 autonomous checkout only through the Gateway inside the User-Defined Guardrail"
    org2_note: "Build on the published User-Defined Guardrail (spend limits, frequency, category restrictions) and the Agent Mandate record; do not define a parallel vocabulary (Fork E, H2 warning)"
    mock: ledger fixture with month-to-date spend
    owner: PD   # eight-role roster, approved by the owner 2026-11-19
    impl: codex
    effort: M
    mvp: CARE
    deps: [K06, K12]
    needs: standing_mandate
  K09:
    name: Trigger gateway (source adapters + classifier)
    layer: product
    v1: "K09 (split: core envelope + per-source adapters)"
    from: [Fork C triggers lattice]
    slot: adapter + node
    timing: "event: trigger.received -> episode.started"
    in: [source payload]
    out: TriggerEvent
    reads: [Trigger@0, Household@1]
    writes: [Trigger@0]
    errors: [CAPABILITY_UNAVAILABLE]
    idempotency: dedupe_key per (source, household, occurrence)
    model: {default: none, tiers: [none, small_tuned], seam: "TriggerClassifier.classify(event) -> {is_trigger, kind, confidence}", fallback: "explicit rules per source; only explicit triggers start episodes"}
    caps: []
    oracle: "trigger precision >= 0.95; trigger-to-episode p95 within SLO; duplicate occurrences start one episode"
    mock: recorded synthetic event streams per source
    owner: MF   # eight-role roster, approved by the owner 2026-11-19
    impl: claude_code
    effort: "M core + S per source"
    mvp: stub (manual + calendar sources, rules only)
    deps: [K23]
    needs: outside_trigger
  K10:
    name: Poll state machine + decision policies
    layer: product
    v1: "K10 (split: transport moved to K23)"
    from: [A lane 8, A poll states, B 'room is Jen']
    slot: node + timer
    timing: "event: poll.opened / poll.response / decision (FIFO by poll_id)"
    in: [Cart x N, policy, rights, closes_at]
    out: Decision
    reads: [Poll@0, Household@1]
    writes: [Poll@0, Ledger@0]
    errors: [STALE, RIGHTS_DENIED]
    idempotency: "response idempotency_key; last vote wins; one decision per poll_id"
    model: {default: none, tiers: [none], fallback: n/a}
    caps: []
    oracle: "property tests: ties, no quorum, late and duplicate votes, timeout -> owner default, stale winner -> next cart; decision before deadline 100%"
    mock: in-process bus (K23) + scripted voters (K25)
    owner: PD   # eight-role roster, approved by the owner 2026-11-19
    impl: codex
    effort: M
    mvp: HW (owner_decides + plurality)
    deps: [K23, K06]
    needs: group_decision
  K11:
    name: Role-scoped card writer (ballot, approval, over-cap, digest)
    layer: product
    v1: "K11 (merged with A lane 4 ballot composer)"
    from: [A lanes 4 and 5]
    slot: node
    timing: sync
    in: [Cart|Decision, MemberRef, VerifyReport]
    out: Card
    reads: [Card@0, Household@1]
    writes: [Card@0]
    errors: [UNVERIFIED_CLAIM]
    idempotency: pure for (inputs, bundle)
    model: {default: small_tuned, tiers: [none, small_tuned, frontier], seam: "CardWriter.write(claims, audience) -> Card@0", fallback: "template cards per (kind, role); every number filled from VerifyReport claims"}
