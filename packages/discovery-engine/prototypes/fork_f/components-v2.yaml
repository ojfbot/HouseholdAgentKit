    mock: claim fixtures; K25 simulated readers
    owner: DX   # eight-role roster, approved by the owner 2026-11-19
    impl: claude_code
    effort: S
    mvp: HW (templates); model tier after Nov 25
    deps: [K03]
    needs: role_card
