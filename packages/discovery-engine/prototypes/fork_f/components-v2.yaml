    layer: product
    v1: "K12 (now the single source of 'who asked, who approved, what was bought')"
    from: [A trace chain mandate->cart->token->order, B ledger_correctness, B requested_by]
    slot: store
    timing: "event: append on every mandate, cart, vote, decision, consent, token, order"
    in: [LedgerEntry]
    out: entry hash
    reads: [Ledger@0]
    writes: [Ledger@0]
