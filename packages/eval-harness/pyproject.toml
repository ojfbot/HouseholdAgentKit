[project]
name = "kit-eval-harness"
version = "0.1.0"
description = "K27 eval harness, hello-world hook, K20 conformance. Synthetic only."
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
dependencies = ["kit-contracts", "kit-verifier", "kit-mock-gateway", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kit_eval*"]

[tool.uv.sources]
kit-contracts = {workspace = true}
kit-verifier = {workspace = true}
kit-mock-gateway = {workspace = true}
kit-eval-harness = {workspace = true}
