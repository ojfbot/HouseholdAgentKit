[project]
name = "kit-gate"
version = "0.1.0"
description = "P02 bundle ids, nightly gate, review queue, digest. Synthetic only."
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
dependencies = ["kit-contracts", "kit-eval-harness", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kit_gate*"]

[tool.uv.sources]
kit-contracts = {workspace = true}
kit-verifier = {workspace = true}
kit-mock-gateway = {workspace = true}
kit-eval-harness = {workspace = true}
