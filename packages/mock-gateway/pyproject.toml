[project]
name = "kit-mock-gateway"
version = "0.1.0"
description = "K17 twin: catalog, slots, clock, labels. Synthetic only."
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
dependencies = ["kit-contracts"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mock_gateway*"]

[tool.uv.sources]
kit-contracts = {workspace = true}
kit-verifier = {workspace = true}
kit-mock-gateway = {workspace = true}
kit-eval-harness = {workspace = true}
